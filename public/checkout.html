
<script>
(function () {
  const WORKER = 'https://stoich-provisions-orders.jpcalma09.workers.dev';

  function connect() {
    const frame = document.querySelector(
      'iframe[src*="stoich-provisions-orders.jpcalma09.workers.dev/checkout"]'
    );

    if (!frame || frame.dataset.stoichBridge === 'connected') return;
    frame.dataset.stoichBridge = 'connected';

    async function sendCart() {
      try {
        const response = await fetch('/cart.js', {
          credentials: 'same-origin',
          headers: { Accept: 'application/json' }
        });

        if (!response.ok) throw new Error('Could not load Shopify cart');

        const cart = await response.json();

        frame.contentWindow.postMessage(
          { type: 'STOICH_SHOPIFY_CART', cart },
          WORKER
        );
      } catch (error) {
        console.error('Stoich cart transfer failed:', error);
      }
    }

    window.addEventListener('message', event => {
      if (
        event.origin === WORKER &&
        event.source === frame.contentWindow &&
        event.data?.type === 'STOICH_REQUEST_SHOPIFY_CART'
      ) {
        sendCart();
      }
    });

    frame.addEventListener('load', sendCart);
    sendCart();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', connect);
  } else {
    connect();
  }
})();
</script>
