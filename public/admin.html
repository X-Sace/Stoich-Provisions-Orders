<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0c">
<title>Stoich Orders</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stoich Orders">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--panel:#131315;--panel2:#1a1a1d;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--text:#f3f3f3;--muted:#9b9ba4;--red:#E32402;--ok:#2fbf71;--warn:#f0b429;--blue:#4c8dff;--purple:#a77bff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.mono{font:600 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .2s,border-color .2s,opacity .2s}
.btn:hover{border-color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:#ff3b17}
.btn.white{background:#fff;color:#000;border-color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.danger{background:transparent;border-color:rgba(255,90,60,.5);color:#ff8a70}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=search],select,textarea{width:100%;min-height:44px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(227,36,2,.18)}
textarea{min-height:84px;resize:vertical}
label.l{display:block;margin:12px 0 6px;color:#c9c9cf}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .box{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}
.login h1{margin:8px 0 6px;font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:44px;line-height:.95}
.check{display:flex;align-items:center;gap:8px;margin:12px 0 4px;color:var(--muted);font-size:13px}
/* app shell */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) max(16px,calc((100vw - 1280px)/2)) 14px;background:rgba(11,11,12,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .brand{display:flex;align-items:baseline;gap:10px}
header.top .brand b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:24px;letter-spacing:.02em;text-transform:uppercase}
header.top .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(47,191,113,.6);animation:ping 2s infinite}
@keyframes ping{to{box-shadow:0 0 0 8px rgba(47,191,113,0)}}
main.app{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:border-color .2s,background .2s}
.stat:hover{border-color:var(--line2)}
.stat.is-on{border-color:var(--red);background:rgba(227,36,2,.07)}
.stat strong{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px;line-height:1.05;margin-top:4px}
.bar{display:flex;gap:10px;align-items:center;margin:16px 0 12px;flex-wrap:wrap}
.bar .search{flex:1 1 260px;position:relative}
.bar .search input{padding-left:38px}
.bar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-size:13px;font-weight:600;cursor:pointer;color:#d6d6db}
.chip.is-on{background:#fff;color:#000;border-color:#fff}
.chip .n{opacity:.6;margin-left:4px}
.list{display:grid;gap:8px}
.ord{display:grid;grid-template-columns:90px minmax(0,1.4fr) minmax(0,1fr) 110px 150px;gap:14px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .2s,background .2s}
.ord:hover{border-color:var(--line2);background:#161619}
.ord.is-sel{border-color:var(--red)}
.ord .num{font-family:Anton,Impact,sans-serif;font-size:22px;letter-spacing:.01em}
.ord .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord .who span,.ord .ful span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord .amt{font-weight:700;text-align:right}
.ord .st{justify-self:end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.08);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-new{color:#ff7a5c;background:rgba(227,36,2,.14)}
.s-confirmed,.s-processing{color:var(--blue);background:rgba(76,141,255,.13)}
.s-awaiting_payment,.s-partially_paid,.s-on_hold{color:var(--warn);background:rgba(240,180,41,.13)}
.s-paid,.s-completed{color:var(--ok);background:rgba(47,191,113,.13)}
.s-ready_for_pickup,.s-out_for_delivery,.s-shipped{color:var(--purple);background:rgba(167,123,255,.14)}
.s-cancelled,.s-refunded,.s-payment_failed{color:#9b9ba4;background:rgba(255,255,255,.07)}
.ord .ful .boxtag{display:inline-flex;overflow:visible}
.boxtag{display:inline-flex;align-items:center;gap:5px;margin-top:4px;padding:2px 8px;border-radius:6px;background:rgba(167,123,255,.14);color:var(--purple);font:600 11px/1.6 ui-monospace,monospace;letter-spacing:.06em}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:14px}
/* drawer */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.is-on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line2);transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
.drawer.is-on{transform:none}
.dh{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 18px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;letter-spacing:.01em;line-height:1}
.dh .sp{flex:1}
.xbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:transparent;cursor:pointer;display:grid;place-items:center}
.db{flex:1;overflow:auto;padding:16px 18px 40px;-webkit-overflow-scrolling:touch}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.sec:first-child{margin-top:0}
.sec h3{margin:0 0 10px;font-size:12px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick a,.quick button{flex-direction:column;gap:4px;min-height:62px;border-radius:14px;font-size:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.items{list-style:none;margin:0;padding:0}
.items li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.items li:first-child{border-top:0;padding-top:0}
.items small{display:block;color:var(--muted)}
.tot{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-weight:700;font-size:16px}
.boxcard{border:1px solid rgba(167,123,255,.35);background:linear-gradient(180deg,rgba(167,123,255,.08),transparent)}
.code{font-family:Anton,Impact,sans-serif;font-size:40px;letter-spacing:.12em;line-height:1}
.codeform{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.codeform input{font:700 22px/1 ui-monospace,monospace;letter-spacing:.25em;text-align:center}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps .chip{min-height:36px}
.pay-hist p{margin:0;padding:10px 0;border-top:1px solid var(--line)}
.pay-hist p:first-child{border-top:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.danger-zone{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line2)}
.toast{position:fixed;left:50%;bottom:22px;z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 18px;border-radius:999px;background:#fff;color:#000;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.4);transition:all .3s;max-width:calc(100% - 32px);text-align:center}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#ff5a3c;color:#fff}
.newdot{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.recip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.recip:first-child{border-top:0}
@media (max-width:900px){
  .ord{grid-template-columns:70px minmax(0,1fr) auto;grid-template-areas:"num who amt" "num ful st";row-gap:4px}
  .ord .num{grid-area:num;font-size:20px}.ord .who{grid-area:who}.ord .ful{grid-area:ful}.ord .amt{grid-area:amt}.ord .st{grid-area:st}
}
@media (max-width:640px){
  header.top{gap:8px}
  header.top .brand b{font-size:20px;white-space:nowrap}
  .live span{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat strong{font-size:28px}
  header.top .brand span{display:none}
  .quick{grid-template-columns:repeat(4,1fr)}
  .kv{grid-template-columns:90px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section class="login" id="login">
  <form class="box" id="loginForm">
    <p class="mono muted">Stoich Provisions · Private</p>
    <h1>Order desk</h1>
    <p class="muted">Enter your admin token to see order requests.</p>
    <label class="l mono" for="token">Admin token</label>
    <input id="token" type="password" autocomplete="current-password" required>
    <label class="check"><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button class="btn red" style="width:100%;margin-top:12px" type="submit">Open order desk</button>
    <p class="muted" id="loginErr" style="color:#ff8a70;min-height:20px;margin:10px 0 0"></p>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><b>Stoich Orders</b><span class="mono muted">Order desk</span></div>
    <span class="sp"></span>
    <span class="live" title="Refreshes every minute"><i></i><span id="updated">Live</span></span>
    <button class="btn sm ghost" id="refreshBtn" title="Refresh">Refresh</button>
    <button class="btn sm ghost" id="settingsBtn">Settings</button>
  </header>
  <main class="app">
    <div class="stats">
      <button class="stat" data-view="new"><span class="mono muted">New</span><strong id="cNew">—</strong></button>
      <button class="stat" data-view="active"><span class="mono muted">In progress</span><strong id="cActive">—</strong></button>
      <button class="stat" data-view="ready_for_pickup"><span class="mono muted">Ready / in box</span><strong id="cReady">—</strong></button>
      <button class="stat" data-view="completed"><span class="mono muted">Completed</span><strong id="cDone">—</strong></button>
    </div>
    <div class="bar">
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span class="vh" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</span><input id="search" type="search" placeholder="Search #, name, email or phone"></label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="list" id="list" style="margin-top:12px"><div class="empty">Loading orders…</div></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-modal="true" role="dialog" aria-labelledby="dTitle">
  <div class="dh">
    <h2 id="dTitle">#—</h2>
    <span id="dStatus"></span>
    <span class="sp"></span>
    <button class="xbtn" id="closeBtn" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="db" id="dBody"></div>
</aside>

<aside class="drawer" id="settings" aria-modal="true" role="dialog" aria-labelledby="sTitle">
  <div class="dh"><h2 id="sTitle">Settings</h2><span class="sp"></span><button class="xbtn" data-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="db">
    <section class="sec">
      <h3 class="mono muted">New-order emails go to</h3>
      <div id="recips" class="muted">Loading…</div>
      <form id="addRecip" class="row2" style="grid-template-columns:1fr auto;margin-top:12px"><input id="recipEmail" type="email" placeholder="name@example.com" required><button class="btn white">Add</button></form>
    </section>
    <section class="sec">
      <h3 class="mono muted">This device</h3>
      <p class="muted" style="margin-top:0">Signing out removes the saved admin token from this browser.</p>
      <button class="btn danger" id="logout">Sign out</button>
    </section>
  </div>
</aside>

<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const LABELS={new:'New',confirmed:'Confirmed',processing:'Processing',awaiting_payment:'Awaiting payment',partially_paid:'Partially paid',paid:'Paid',ready_for_pickup:'Ready for pickup',out_for_delivery:'Out for delivery',shipped:'Shipped',on_hold:'On hold',completed:'Completed',cancelled:'Cancelled',refunded:'Refunded',payment_failed:'Payment failed'};
const ACTIVE=['confirmed','processing','awaiting_payment','partially_paid','paid','out_for_delivery','shipped','on_hold'];
const FLOW=['confirmed','awaiting_payment','paid','ready_for_pickup','out_for_delivery','completed'];
let token='',orders=[],view='open',selected=null,seenMax=0,timer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>'$'+((Number(c)||0)/100).toFixed(2);
const pill=s=>`<span class="pill s-${esc(s)}">${esc(LABELS[s]||s)}</span>`;
const store=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const load=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
function ago(iso){const s=(Date.now()-new Date(iso))/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<604800)return Math.floor(s/86400)+'d ago';return new Date(iso).toLocaleDateString();}
function toast(t,err){const el=$('toast');el.textContent=t;el.className='toast is-on'+(err?' err':'');clearTimeout(el._t);el._t=setTimeout(()=>el.className='toast',3200);}
function digits(p){let d=String(p||'').replace(/\D/g,'');if(d.length===7)d='1671'+d;else if(d.length===10)d='1'+d;return d;}
function shortFul(f){return({'Guam store pickup':'Pickup · Harmon','Pickup box (24/7)':'Pickup box','Guam local delivery':'Guam delivery','Saipan delivery':'Saipan delivery'})[f]||f;}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'content-type':'application/json',authorization:'Bearer '+token,...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error('Session expired. Enter the admin token again.');}if(!r.ok)throw Error(d.error||'Request failed');return d;}

/* ---------- login ---------- */
async function start(t,remember){token=t;try{await refresh(true);if(remember)store('stoich-admin-token',t);$('login').hidden=true;$('app').hidden=false;clearInterval(timer);timer=setInterval(()=>refresh().catch(()=>{}),60000);}catch(e){token='';$('loginErr').textContent=e.message;$('login').hidden=false;$('app').hidden=true;}}
function logout(){store('stoich-admin-token',null);token='';clearInterval(timer);closeAll();$('app').hidden=true;$('login').hidden=false;}
$('loginForm').onsubmit=e=>{e.preventDefault();$('loginErr').textContent='';start($('token').value.trim(),$('remember').checked);};
$('logout').onclick=logout;

/* ---------- list ---------- */
async function refresh(first){const d=await api('/api/admin/orders');orders=d.orders||[];const max=orders.reduce((m,o)=>Math.max(m,o.order_number),0);const newest=load('stoich-admin-seen')|0;if(!first&&max>seenMax&&seenMax)toast('New order request #'+max);seenMax=max;if(!newest)store('stoich-admin-seen',max);$('updated').textContent='Updated '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});render();if(selected){const f=orders.find(o=>o.id===selected.id);if(f){selected=f;if($('drawer').classList.contains('is-on'))renderDetail(false);}}}
function counts(){return{new:orders.filter(o=>o.status==='new').length,active:orders.filter(o=>ACTIVE.includes(o.status)).length,ready:orders.filter(o=>o.status==='ready_for_pickup').length,done:orders.filter(o=>o.status==='completed').length};}
function inView(o){if(view==='open')return !['completed','cancelled','refunded'].includes(o.status);if(view==='all')return true;if(view==='active')return ACTIVE.includes(o.status);return o.status===view;}
function render(){
  const c=counts();$('cNew').textContent=c.new;$('cActive').textContent=c.active;$('cReady').textContent=c.ready;$('cDone').textContent=c.done;
  document.querySelectorAll('.stat').forEach(b=>b.classList.toggle('is-on',b.dataset.view===view));
  const chipDefs=[['open','Open'],['new','New'],['active','In progress'],['awaiting_payment','Awaiting payment'],['ready_for_pickup','Ready / in box'],['completed','Completed'],['cancelled','Cancelled'],['all','All']];
  $('chips').innerHTML=chipDefs.map(([v,l])=>{const n=orders.filter(o=>v==='all'||(v==='open'?!['completed','cancelled','refunded'].includes(o.status):v==='active'?ACTIVE.includes(o.status):o.status===v)).length;return `<button class="chip${view===v?' is-on':''}" data-v="${v}">${l}<span class="n">${n}</span></button>`;}).join('');
  $('chips').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();});
  const q=$('search').value.trim().toLowerCase();
  const list=orders.filter(o=>(q?[o.order_number,o.customer_name,o.email,o.phone].some(v=>String(v||'').toLowerCase().includes(q)):inView(o)));
  $('list').innerHTML=list.length?list.map(o=>{const items=(o.items||[]).reduce((s,i)=>s+(Number(i.quantity)||0),0);return `<button class="ord${selected&&selected.id===o.id?' is-sel':''}" data-id="${esc(o.id)}"><span class="num">#${o.order_number}</span><span class="who"><b>${esc(o.customer_name)}</b><span>${esc(o.phone)} · ${esc(o.contact_preference)}</span></span><span class="ful"><b style="font-weight:600">${esc(shortFul(o.fulfillment_method))}</b><span>${items} item${items===1?'':'s'} · ${ago(o.created_at)}</span>${o.box_code?`<span class="boxtag">BOX · ${esc(o.box_code)}</span>`:''}</span><span class="amt">${money(o.subtotal_cents)}</span><span class="st">${pill(o.status)}</span></button>`;}).join(''):`<div class="empty">${q?'No orders match that search.':'Nothing here right now.'}</div>`;
  $('list').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openOrder(b.dataset.id));
}
document.querySelectorAll('.stat').forEach(b=>b.onclick=()=>{view=view===b.dataset.view?'open':b.dataset.view;render();});
let st;$('search').oninput=()=>{clearTimeout(st);st=setTimeout(render,120);};
$('refreshBtn').onclick=()=>refresh().then(()=>toast('Up to date')).catch(e=>toast(e.message,true));

/* ---------- drawers ---------- */
function openDrawer(id){$(id).classList.add('is-on');$('scrim').classList.add('is-on');document.body.style.overflow='hidden';}
function closeAll(){['drawer','settings'].forEach(id=>$(id).classList.remove('is-on'));$('scrim').classList.remove('is-on');document.body.style.overflow='';}
$('scrim').onclick=closeAll;$('closeBtn').onclick=closeAll;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAll);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();});
$('settingsBtn').onclick=()=>{openDrawer('settings');loadRecips();};

/* ---------- order detail ---------- */
function openOrder(id){selected=orders.find(o=>o.id===id);if(!selected)return;renderDetail(true);openDrawer('drawer');render();}
function renderDetail(reset){
  const o=selected;$('dTitle').textContent='#'+o.order_number;$('dStatus').innerHTML=pill(o.status);
  const wa=digits(o.phone);const first=(o.customer_name||'').split(' ')[0]||'there';
  const waText=encodeURIComponent(`Hi ${first}, this is Stoich Provisions about your order request #${o.order_number}.`);
  const isBox=o.fulfillment_method==='Pickup box (24/7)';
  const keepNotes=!reset&&document.activeElement&&document.activeElement.id==='notes'?$('notes').value:null;
  $('dBody').innerHTML=`
  <section class="sec">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><div style="font-size:18px;font-weight:700">${esc(o.customer_name)}</div><div class="muted">${new Date(o.created_at).toLocaleString()} · prefers ${esc(o.contact_preference)}</div></div></div>
    <div class="quick" style="margin-top:12px">
      <a class="btn" href="https://wa.me/${wa}?text=${waText}" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.7-.1l2 .9c.3.2.5.2.6.4 0 .1 0 .7-.2 1.3Z"/></svg>WhatsApp</a>
      <a class="btn" href="sms:+${wa}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Text</a>
      <a class="btn" href="tel:+${wa}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>Call</a>
      <a class="btn" href="mailto:${esc(o.email)}?subject=${encodeURIComponent('Your Stoich Provisions order #'+o.order_number)}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>Email</a>
    </div>
    <dl class="kv" style="margin:14px 0 0"><dt>Phone</dt><dd>${esc(o.phone)}</dd><dt>Email</dt><dd>${esc(o.email)}</dd><dt>Fulfillment</dt><dd><b>${esc(o.fulfillment_method)}</b></dd>${o.address?`<dt>Address</dt><dd>${esc(o.address)}<br><a class="muted" href="https://maps.google.com/?q=${encodeURIComponent(o.address)}" target="_blank" rel="noopener">Open in Maps ↗</a></dd>`:''}${o.customer_notes?`<dt>Customer note</dt><dd>${esc(o.customer_notes)}</dd>`:''}</dl>
  </section>

  <section class="sec boxcard">
    <h3 class="mono" style="color:var(--purple)">Pickup box${isBox?' · customer chose the box':''}</h3>
    ${o.box_code?`<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><div class="muted" style="font-size:12px">Code sent ${ago(o.box_loaded_at)}</div><div class="code">${esc(o.box_code)}</div></div><button class="btn sm" id="boxAgain">Change code / resend</button></div>`:`<p class="muted" style="margin:0">When the order is in the box, press the button and enter the code you made in the Loxx Boxx app. We email it to the customer and mark the order ready.</p>`}
    <button class="btn ${o.box_code?'ghost':'white'}" id="boxBtn" style="width:100%;margin-top:12px${o.box_code?';display:none':''}">Loaded in pickup box</button>
    <form class="codeform" id="boxForm" hidden><input id="boxCode" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="Box code" autocomplete="off" aria-label="Pickup box code"><button class="btn red" type="submit">Send code</button></form>
    <p class="muted" id="boxHint" hidden style="font-size:12.5px;margin:8px 0 0">Emails the code to ${esc(o.email)} and sets the order to “Ready for pickup”.</p>
  </section>

  <section class="sec">
    <h3 class="mono muted">Status <span style="text-transform:none;letter-spacing:0;font-weight:400">· the customer gets an email when it changes</span></h3>
    <div class="steps" id="flow">${FLOW.map(s=>`<button class="chip${o.status===s?' is-on':''}" data-s="${s}">${LABELS[s]}</button>`).join('')}</div>
    <div class="row2" style="margin-top:10px;grid-template-columns:1fr auto"><select id="statusSel">${Object.keys(LABELS).map(s=>`<option value="${s}"${o.status===s?' selected':''}>${LABELS[s]}</option>`).join('')}</select><button class="btn" id="statusSave">Set</button></div>
  </section>

  <section class="sec">
    <h3 class="mono muted">Items</h3>
    <ul class="items">${(o.items||[]).map(i=>`<li><span>${Number(i.quantity)} × ${esc(i.title)}${i.variant?`<small>${esc(i.variant)}${i.sku?' · '+esc(i.sku):''}</small>`:(i.sku?`<small>${esc(i.sku)}</small>`:'')}</span><b>${money(i.line_total_cents)}</b></li>`).join('')}</ul>
    <div class="tot"><span>Subtotal</span><span>${money(o.subtotal_cents)}</span></div>
  </section>

  <section class="sec">
    <h3 class="mono muted">Payments & receipts</h3>
    <div id="paySum" class="muted">Loading…</div>
    <div class="pay-hist" id="payHist"></div>
    <form id="payForm" style="margin-top:8px">
      <div class="row2"><div><label class="l mono" for="payAmt">Amount</label><input id="payAmt" type="number" min="0.01" step="0.01" inputmode="decimal" required></div><div><label class="l mono" for="payMethod">Method</label><select id="payMethod"><option>Cash</option><option>Zelle</option><option>PayPal</option><option>Card</option><option>Bank transfer</option><option>Check</option><option>Other</option></select></div></div>
      <div class="row2"><div><label class="l mono" for="payKind">Type</label><select id="payKind"><option value="payment">Payment received</option><option value="refund">Refund issued</option></select></div><div><label class="l mono" for="payRef">Reference</label><input id="payRef" type="text" maxlength="150" placeholder="Optional"></div></div>
      <label class="l mono" for="payNotes">Note</label><input id="payNotes" type="text" placeholder="Optional">
      <button class="btn white" style="width:100%;margin-top:12px" type="submit">Record & email receipt</button>
    </form>
  </section>

  <section class="sec">
    <h3 class="mono muted">Internal notes</h3>
    <textarea id="notes" placeholder="Only your team sees this">${esc(o.internal_notes||'')}</textarea>
    <button class="btn" id="notesSave" style="margin-top:10px">Save notes</button>
    <div class="danger-zone"><button class="btn danger sm" id="delBtn">Delete order</button></div>
  </section>`;
  if(keepNotes!==null){$('notes').value=keepNotes;$('notes').focus();}

  /* pickup box */
  const showForm=()=>{$('boxForm').hidden=false;$('boxHint').hidden=false;$('boxBtn').style.display='none';$('boxCode').value='';setTimeout(()=>$('boxCode').focus(),50);};
  $('boxBtn').onclick=showForm;if($('boxAgain'))$('boxAgain').onclick=showForm;
  $('boxCode').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'');};
  $('boxForm').onsubmit=async e=>{e.preventDefault();const code=$('boxCode').value.trim();if(!/^\d{4,10}$/.test(code))return toast('Enter the 4–10 digit box code',true);const b=e.submitter||$('boxForm').querySelector('button');b.disabled=true;b.textContent='Sending…';try{const d=await api('/api/admin/orders/'+o.id+'/pickup-box',{method:'POST',body:JSON.stringify({code})});toast(d.email_queued?'Code '+code+' sent to '+o.email:'Saved. No valid customer email on file.');await refresh();}catch(err){toast(err.message,true);b.disabled=false;b.textContent='Send code';}};

  /* status */
  const setStatus=async s=>{if(s===o.status)return;try{await api('/api/admin/orders/'+o.id,{method:'PATCH',body:JSON.stringify({status:s})});toast('Marked '+LABELS[s]+' · customer emailed');await refresh();}catch(err){toast(err.message,true);}};
  $('flow').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>setStatus(b.dataset.s));
  $('statusSave').onclick=()=>setStatus($('statusSel').value);

  /* notes */
  $('notesSave').onclick=async()=>{try{await api('/api/admin/orders/'+o.id,{method:'PATCH',body:JSON.stringify({internal_notes:$('notes').value})});toast('Notes saved');await refresh();}catch(err){toast(err.message,true);}};

  /* delete */
  $('delBtn').onclick=async()=>{const n=o.order_number;const typed=prompt('Type '+n+' to permanently delete order #'+n+'. This cannot be undone.');if(String(typed||'').trim()!==String(n))return;try{await api('/api/admin/orders/'+o.id,{method:'DELETE'});selected=null;closeAll();toast('Order #'+n+' deleted');await refresh();}catch(err){toast(err.message,true);}};

  /* payments */
  loadPayments(o);
  $('payForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/admin/orders/'+o.id+'/payments',{method:'POST',body:JSON.stringify({kind:$('payKind').value,amount:$('payAmt').value,method:$('payMethod').value,reference:$('payRef').value,notes:$('payNotes').value})});toast('Recorded · receipt emailed · '+(LABELS[d.status]||d.status));$('payRef').value='';$('payNotes').value='';await refresh();loadPayments(selected);}catch(err){toast(err.message,true);}};
}
async function loadPayments(o){try{const d=await api('/api/admin/orders/'+o.id+'/payments');if(!selected||selected.id!==o.id)return;$('paySum').innerHTML=`Paid <b style="color:#fff">${money(d.paid_cents)}</b> of ${money(d.order.subtotal_cents)}${d.refunded_cents?' · refunded '+money(d.refunded_cents):''} · <b style="color:${d.balance_cents?'var(--warn)':'var(--ok)'}">${d.balance_cents?money(d.balance_cents)+' left':'Paid in full'}</b>`;$('payHist').innerHTML=(d.payments||[]).map(p=>`<p><b>${p.kind==='refund'?'Refund':'Payment'} · ${money(p.amount_cents)}</b> <span class="muted">· ${esc(p.method)} · ${new Date(p.created_at).toLocaleDateString()}${p.reference?' · '+esc(p.reference):''}</span>${p.notes?`<br><span class="muted">${esc(p.notes)}</span>`:''}</p>`).join('');const amt=$('payAmt');if(amt&&!amt.value&&d.balance_cents)amt.value=(d.balance_cents/100).toFixed(2);}catch(err){$('paySum').textContent=err.message;}}

/* ---------- settings: recipients ---------- */
async function loadRecips(){try{const d=await api('/api/admin/recipients');$('recips').classList.remove('muted');$('recips').innerHTML=(d.recipients||[]).map(r=>`<div class="recip"><span>${esc(r.email)}${r.enabled?'':' <span class="muted">(off)</span>'}</span><button class="btn sm" data-id="${r.id}" data-en="${r.enabled?0:1}">${r.enabled?'Turn off':'Turn on'}</button></div>`).join('')||'<p class="muted">No recipients yet.</p>';$('recips').querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{try{await api('/api/admin/recipients/'+b.dataset.id,{method:'PATCH',body:JSON.stringify({enabled:b.dataset.en==='1'})});loadRecips();toast('Updated');}catch(e){toast(e.message,true);}});}catch(e){$('recips').textContent=e.message;}}
$('addRecip').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/recipients',{method:'POST',body:JSON.stringify({email:$('recipEmail').value})});$('recipEmail').value='';loadRecips();toast('Recipient added');}catch(err){toast(err.message,true);}};

/* ---------- boot ---------- */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token)refresh().catch(()=>{});});
const saved=load('stoich-admin-token');if(saved)start(saved,true);
})();
</script>
</body>
</html>
